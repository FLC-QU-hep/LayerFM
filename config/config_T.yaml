name: LayerFM_PandT_embeddings_multiLoss_quantileALL

data:
  data_file: ../pion-clouds/files/npy_array/points_HGx9new/input_for_pcFM.h5
  transform_num_points:
    - [Dequantize, {}]
    - [QuantileTransformer, {n_quantiles: 1000, shape: [1, 78]}]
  transform_min_time:
    - [QuantileTransformer, {n_quantiles: 1000, shape: [1, 78]}]
  transform_en_perl:
    - [QuantileTransformer, {n_quantiles: 1000, shape: [1, 78]}]
  transform_inc:
    - [StandardScaler, {shape: [1, 1]}]
  batch_size: 1024
  batch_size_val: 4096
  num_val: 50000
  num_classes: 0
  num_layers: 78

model:
  name: FullyConnected
  dim_input: 156 # [points, min_time]
  dim_condition: 5 # 3 directions + 1 energy
  dim_time: 6
  n_layers: 78
  dim_embedding: 128
  hidden_dims:
    - 256
    - 512
    - 1024
    - 512
    - 256

training:
  epochs: 1500
  optimizer:
    name: Adam
    lr: 0.0007 #0.001
  scheduler:
    name: OneCycleLR
