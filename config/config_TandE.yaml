name: LayerFM

data:
  data_file: ../pion-clouds/files/npy_array/points_HGx9new/input_for_pcFM_withE.h5
  transform_num_points:
    - [Log, {alpha: 0.5}]
    - [StandardScaler, {shape: [1, 78]}]
  transform_min_time:
    - [Log, {alpha: 0.5}]
    - [StandardScaler, {shape: [1, 78]}]
  transform_en_perl:
    - [Log, {alpha: 0.5}]
    - [StandardScaler, {shape: [1, 78]}]
  transform_inc:
    - [StandardScaler, {shape: [1, 1]}]
  batch_size: 1024
  batch_size_val: 4096
  num_val: 50000
  num_classes: 0
  num_layers: 78

model:
  name: FullyConnected
  dim_input: 234 # [points, min_time, energy]
  dim_condition: 5 # 3 directions + 1 energy
  dim_time: 6
  hidden_dims:
    - 512
    - 1024
    - 2048
    - 1024
    - 512

training:
  epochs: 1500
  optimizer:
    name: Adam
    lr: 0.0003 #0.001
  scheduler:
    name: OneCycleLR
