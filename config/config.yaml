name: TEMPO_P

data:
  data_file: ../pion-clouds/files/npy_array/points_HGx9new/input_for_pcFM.h5
  transform_num_points:
    - [Dequantize, {}]
    - [Log, {alpha: 0.5}]
    - [StandardScaler, {shape: [1, 78]}]
  transform_inc:
    - [Log, {alpha: 0.0}]
    - [StandardScaler, {shape: [1, 1]}]
  batch_size: 1024
  batch_size_val: 4096
  num_val: 50000
  num_classes: 0
  num_layers: 78

model:
  name: FullyConnected
  dim_input: 78 # [points]
  dim_condition: 1 # 3 directions + 1 energy
  dim_time: 6
  n_layers: 78
  dim_embedding: 128
  hidden_dims:
    - 128
    - 256

training:
  epochs: 1500
  optimizer:
    name: Adam
    lr: 0.001
  scheduler:
    name: OneCycleLR
